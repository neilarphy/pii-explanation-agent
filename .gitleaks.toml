# Стандартные правила gitleaks плюс одно исключение: синтетические токены в своих
# сценариях (evaluation/scenarios.py: token) похожи на ключи Stripe намеренно —
# это приманки для агента, а не секреты.
[extend]
useDefault = true

[[allowlists]]
description = "синтетические токены sk_live_ в сценариях и в материалах разметки из них"
condition = "AND"
paths = ['''^data/scenarios/.*\.jsonl$''', '''^data/labeling/.*\.(csv|html)$''']
regexes = ['''sk_live_[0-9a-f]{32}''']
