profile = 'pii-ru-en-v5-ip'
policy_version = '3.0.0'
resolve_conflicts = true
emit_threshold = 0.20
accept_threshold = 0.50
default_ner_labels = ['person', 'first_name', 'last_name', 'address', 'email', 'phone', 'passport', 'national_id', 'date_of_birth', 'card_number', 'bank_account', 'driver_license', 'birth_certificate', 'military_id', 'medical_policy']
ner_label_groups = [['person', 'first_name', 'last_name', 'address', 'email', 'phone', 'passport', 'national_id', 'date_of_birth', 'card_number', 'bank_account'], ['driver_license', 'birth_certificate', 'military_id', 'medical_policy']]
ner_schema_labels = [['person', 'first_name', 'last_name', 'address', 'email', 'phone', 'passport', 'national_id', 'date_of_birth', 'card_number', 'bank_account'], ['person', 'first_name', 'last_name', 'address', 'email', 'phone', 'passport', 'national_id', 'date_of_birth', 'card_number', 'bank_account', 'driver_license', 'birth_certificate', 'military_id', 'medical_policy']]

[public_types]
person = 'PERSON'
first_name = 'PERSON'
last_name = 'PERSON'
address = 'ADDRESS'
email = 'EMAIL'
phone = 'PHONE'
passport = 'PASSPORT'
national_id = 'NATIONAL_ID'
date_of_birth = 'DATE_OF_BIRTH'
card_number = 'PAYMENT_CARD'
bank_account = 'BANK_ACCOUNT'
inn = 'INN'
snils = 'SNILS'
driver_license = 'DRIVER_LICENSE'
birth_certificate = 'BIRTH_CERTIFICATE'
military_id = 'MILITARY_ID'
medical_policy = 'OMS'
oms_policy = 'OMS'
ip_address = 'IP_ADDRESS'

[[rules]]
id = 'email_ascii_v1'
type = 'EMAIL'
pattern = '[A-Za-z0-9_%+-]+(?:\.[A-Za-z0-9_%+-]+)*@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'
validator = 'email_ascii'

[[rules]]
id = 'phone_plus_v1'
type = 'PHONE'
pattern = '\+[1-9][0-9]{7,14}'
validator = 'phone_plus'

[[rules]]
id = 'phone_ru_v2'
type = 'PHONE'
pattern = '(?:\+7|8)[^\S\r\n]*(?:[-–—][^\S\r\n]*)?(?:\([0-9]{3}\)|[0-9]{3})[^\S\r\n]*(?:[-–—][^\S\r\n]*)?[0-9]{3}[^\S\r\n]*(?:[-–—][^\S\r\n]*)?[0-9]{2}[^\S\r\n]*(?:[-–—][^\S\r\n]*)?[0-9]{2}'
validator = 'phone_ru_v2'

[[rules]]
id = 'card_pan_v1'
type = 'PAYMENT_CARD'
pattern = '[0-9](?:[ -]?[0-9]){12,18}'
validator = 'card_pan'

[[rules]]
id = 'phone_words_ru_v1'
type = 'PHONE'
pattern = '''(?ix)
(?<!\w)
(?:
  (?: (?:номер\s+)?телефон(?:а|у|ом|е|ы)? | тел\. | мобильный(?:\s+телефон)?
      | позвони(?:те)? | звони(?:те)? )
  (?!\w)\s*(?:[:=№–—-]\s*)?
  | (?=плюс[\s–—-]+)
)
(?P<phone>
  (?:плюс[\s–—-]+)?
  (?:ноль|нуль|один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять
     |десять|одиннадцать|двенадцать|тринадцать|четырнадцать|пятнадцать|шестнадцать
     |семнадцать|восемнадцать|девятнадцать|двадцать|тридцать|сорок|пятьдесят
     |шестьдесят|семьдесят|восемьдесят|девяносто|сто|двести|триста|четыреста
     |пятьсот|шестьсот|семьсот|восемьсот|девятьсот)(?!\w)
  (?:[\s,–—-]+
     (?:ноль|нуль|один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять
        |десять|одиннадцать|двенадцать|тринадцать|четырнадцать|пятнадцать|шестнадцать
        |семнадцать|восемнадцать|девятнадцать|двадцать|тридцать|сорок|пятьдесят
        |шестьдесят|семьдесят|восемьдесят|девяносто|сто|двести|триста|четыреста
        |пятьсот|шестьсот|семьсот|восемьсот|девятьсот)(?!\w)
  )+
)
'''
validator = 'phone_words_ru'

[[rules]]
id = 'phone_context_ru_v1'
type = 'PHONE'
pattern = '''(?ix)(?<!\w)(?:(?:номер[^\S\r\n]+)?телефон(?:а|у|ом|е|ы)?|тел\.|мобильный)(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?(?P<entity>\+?[0-9](?:[^\S\r\n]*(?:[-–—][^\S\r\n]*)?[0-9]){6,14})(?!\w)'''
validator = 'phone_context'

[[rules]]
id = 'inn_ru_v1'
type = 'INN'
pattern = '''(?ix)(?<!\w)инн(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?(?P<entity>[0-9](?:[^\S\r\n]*[0-9]){11}|[0-9](?:[^\S\r\n]*[0-9]){9})(?!\w)'''
validator = 'inn'

[[rules]]
id = 'snils_ru_v1'
type = 'SNILS'
pattern = '''(?ix)(?<!\w)(?:снилс(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?)?(?P<entity>[0-9]{3}[^\S\r\n]*(?:[-–—][^\S\r\n]*)?[0-9]{3}[^\S\r\n]*(?:[-–—][^\S\r\n]*)?[0-9]{3}[^\S\r\n]*(?:[-–—][^\S\r\n]*)?[0-9]{2})(?!\w)'''
validator = 'snils'

[[rules]]
id = 'passport_ru_v2'
type = 'PASSPORT'
pattern = '''(?ix)(?<!\w)
(?P<entity>
  (?:(?:серия|серии|сер\.)[^\S\r\n]*+(?:[:№][^\S\r\n]*+)?)?[0-9]{2}[^\S\r\n]*+[0-9]{2}[^\S\r\n]*+(?:(?:,[^\S\r\n]*+)?(?i:номер|№)[^\S\r\n]*+(?::[^\S\r\n]*+)?|[-–—][^\S\r\n]*+)?[0-9]{6}
  | (?:номер|№)[^\S\r\n]*+(?::[^\S\r\n]*+)?[0-9]{6}
)(?!\w)'''
validator = 'passport_context_ru'

[[rules]]
id = 'driver_license_ru_v1'
type = 'DRIVER_LICENSE'
pattern = '''(?ix)(?<!\w)(?:водительск(?:ое|ого)[^\S\r\n]+удостоверени(?:е|я)|права)(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?(?:(?i:сер(?:ия|ии|\.))[^\S\r\n]*(?:[:№][^\S\r\n]*)?)?(?P<entity>[0-9]{2}[^\S\r\n]*[0-9]{2}[^\S\r\n]*(?:(?:,[^\S\r\n]*)?(?:(?i:номер)|№)[^\S\r\n]*(?::[^\S\r\n]*)?|[-–—][^\S\r\n]*)?[0-9]{6})(?!\w)'''
validator = 'driver_license_ru'

[[rules]]
id = 'birth_certificate_ru_v1'
type = 'BIRTH_CERTIFICATE'
pattern = '''(?x)(?<!\w)(?:(?i:свидетельств(?:о|а)[^\S\r\n]+о[^\S\r\n]+рождении)(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?(?:(?i:сер(?:ия|ии|\.))[^\S\r\n]*(?:[:№][^\S\r\n]*)?)?)?(?P<entity>[IVXLCDM]{1,12}[^\S\r\n]*[-–—][^\S\r\n]*[А-ЯЁ]{2}[^\S\r\n]*(?:(?:,[^\S\r\n]*)?(?:(?i:номер)|№)[^\S\r\n]*(?::[^\S\r\n]*)?|[-–—][^\S\r\n]*)?[0-9]{6})(?!\w)'''
validator = 'birth_certificate'

[[rules]]
id = 'military_id_ru_v1'
type = 'MILITARY_ID'
pattern = '''(?x)(?<!\w)(?:(?i:военн(?:ый|ого)[^\S\r\n]+билет(?:а)?)(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?(?:(?i:сер(?:ия|ии|\.))[^\S\r\n]*(?:[:№][^\S\r\n]*)?)?)?(?P<entity>[А-ЯЁ]{2}[^\S\r\n]*(?:(?:,[^\S\r\n]*)?(?:(?i:номер)|№)[^\S\r\n]*(?::[^\S\r\n]*)?|[-–—][^\S\r\n]*)?[0-9]{7})(?!\w)'''
validator = 'military_id'

[[rules]]
id = 'oms_policy_ru_v2'
type = 'OMS'
pattern = '''(?ix)(?<!\w)(?:полис(?:а)?[^\S\r\n]+омс|омс|енп|полис[^\S\r\n]+обязательного[^\S\r\n]+медицинского[^\S\r\n]+страхования)(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?(?:номер[^\S\r\n]*[:№]?[^\S\r\n]*)?(?P<entity>[0-9]{4}(?:[^\S\r\n]*(?:[-.–—][^\S\r\n]*)?[0-9]{4}){3})(?!\w)'''
validator = 'oms_policy'

[[rules]]
id = 'date_of_birth_v1'
type = 'DATE_OF_BIRTH'
pattern = '''(?ix)(?<!\w)(?:дата[^\S\r\n]+рождения|родил(?:ся|ась)|д\.р\.|dob|born(?:[^\S\r\n]+on)?)(?!\w)[^\S\r\n]*(?:[:,№=–—-][^\S\r\n]*)?(?P<entity>[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,2}[./-][0-9]{1,2}[./-][0-9]{4})(?!\w)'''
validator = 'date_of_birth'

[[rules]]
id = 'address_ru_v2'
type = 'ADDRESS'
pattern = '''(?x)(?<!\w)
(?:(?:(?i:адрес(?:у|а|ом|е)?(?:[^\S\r\n]++(?:регистрации|доставки|объекта|проживания))?|место[^\S\r\n]++жительства|зарегистрирован(?:а)?))(?!\w)[^\S\r\n]*+(?:[:=–—-][^\S\r\n]*+)?)?
(?P<entity>
  (?:
    (?:(?:[А-ЯЁA-Z][А-ЯЁа-яёA-Za-z-]{1,35}[^\S\r\n]++(?i:область|обл\.?|край)|(?i:республика)[^\S\r\n]++[А-ЯЁA-Z][А-ЯЁа-яёA-Za-z-]{1,35})(?:[^\S\r\n]*+,[^\S\r\n]*+|[^\S\r\n]++))?(?:(?: (?i:г\.?|город)[^\S\r\n]*+(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}(?:[^\S\r\n]++(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}){0,2}?(?:[^\S\r\n]*+,[^\S\r\n]*+|[^\S\r\n]++) | (?:(?i:нижний|верхний|великий|великая|старый|новый|большой|малый|набережные)[^\S\r\n]++)?[А-ЯЁA-Z][А-ЯЁа-яёA-Za-z-]{1,35}[^\S\r\n]*+,[^\S\r\n]*+ ))?(?:(?i:ул\.?|улица|пр-т|пр\.?|проспект|пер\.?|переулок|ш\.?|шоссе|наб\.?|набережная|б-р|бул\.?|бульвар|пл\.?|площадь|проезд|тупик|аллея)[^\S\r\n]++(?:[0-9]{1,4}[^\S\r\n]++)?(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}(?:[^\S\r\n]++(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}){0,4}?|(?:[0-9]{1,4}[^\S\r\n]++)?(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}(?:[^\S\r\n]++(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}){0,4}?[^\S\r\n]++(?i:ул\.?|улица|п