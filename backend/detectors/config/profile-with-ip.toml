[[rules]]
id = 'ipv4_v1'
type = 'IP_ADDRESS'
pattern = '''(?<![\w:.])(?P<entity>(?:[0-9]{1,3}\.){3}[0-9]{1,3})(?!\w)'''
validator = 'ip_address'

[[rules]]
id = 'ipv6_v1'
type = 'IP_ADDRESS'
pattern = '''(?i)(?<![\w:])(?P<entity>(?:[0-9a-f]{0,4}:){2,7}(?:(?:[0-9]{1,3}\.){3}[0-9]{1,3}|[0-9a-f]{0,4}))(?![\w:])'''
validator = 'ip_address'
