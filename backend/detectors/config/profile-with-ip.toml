    | (?:(?:[А-ЯЁA-Z][А-ЯЁа-яёA-Za-z-]{1,35}[^\S\r\n]++(?i:область|обл\.?|край)|(?i:республика)[^\S\r\n]++[А-ЯЁA-Z][А-ЯЁа-яёA-Za-z-]{1,35})(?:[^\S\r\n]*+,[^\S\r\n]*+|[^\S\r\n]++))?(?: (?i:г\.?|город)[^\S\r\n]*+(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}(?:[^\S\r\n]++(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}){0,2}?(?:[^\S\r\n]*+,[^\S\r\n]*+|[^\S\r\n]++) | (?:(?i:нижний|верхний|великий|великая|старый|новый|большой|малый|набережные)[^\S\r\n]++)?[А-ЯЁA-Z][А-ЯЁа-яёA-Za-z-]{1,35}[^\S\r\n]*+,[^\S\r\n]*+ )(?:[0-9]{1,4}[^\S\r\n]++)?(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}(?:[^\S\r\n]++(?!(?i:на|по|в|во|у|к|ко|от|до|из|за|для|жду|заказ|адрес|телефон|тел|мой|моя|меня|зовут|вроде|же|уже|теперь|это|них|ихний|адрс|привезите|доставить|приезжайте|пишите|живу)(?!\w))[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z–—-]{0,35}){0,4}?(?:[^\S\r\n]*+,[^\S\r\n]*+|[^\S\r\n]++)(?:(?i:д\.?|дом)[^\S\r\n]*+)?[0-9]{1,5}[А-ЯЁа-яёA-Za-z]?(?:[/-][0-9]{1,5}[А-ЯЁа-яёA-Za-z]?)?(?:(?:[^\S\r\n]*+,[^\S\r\n]*+|[^\S\r\n]++)(?:(?i:корпус|корп\.?|к\.|строение|стр\.?|квартира|кв\.?|офис|оф\.?|помещение|пом\.?|подъезд|подьезд|под\.?|этаж|эт\.?)[^\S\r\n]*+[0-9]{1,5}[А-ЯЁа-яёA-Za-z]?(?:[/-][0-9]{1,5}[А-ЯЁа-яёA-Za-z]?)?|[0-9]{1,3}[^\S\r\n]++(?i:подъезд|подьезд|под|этаж|эт))(?!\w)){1,6}
