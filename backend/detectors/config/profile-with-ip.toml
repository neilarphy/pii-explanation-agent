type = 'ADDRESS'
pattern = '''(?x)(?<!\w)
(?:(?i:адрес(?:у|а|ом|е)?(?:[^\S\r\n]++(?:регистрации|доставки|объекта|проживания))?|место[^\S\r\n]++жительства|зарегистрирован(?:а)?)|(?i:доставка|доставить|привезите)[^\S\r\n]++(?i:на|по[^\S\r\n]++адресу))(?!\w)[^\S\r\n]*+(?:[:=–—-][^\S\r\n]*+)?
