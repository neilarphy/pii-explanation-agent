profile = 'pii-ru-en-v1'
policy_version = '1.0.0'
emit_threshold = 0.20
accept_threshold = 0.50
default_ner_labels = ['person', 'first_name', 'last_name', 'address', 'email', 'phone', 'passport', 'national_id', 'date_of_birth', 'card_number', 'bank_account']

[public_types]
person = 'PERSON'
first_name = 'PERSON'
last_name = 'PERSON'
address = 'ADDRESS'
email = 'EMAIL'
phone = 'PHONE'
passport = 'PASSPORT'
national_id = 'NATIONAL_ID'
date_of_birth = 'DATE_OF_BIRTH'
card_number = 'PAYMENT_CARD'
bank_account = 'BANK_ACCOUNT'

[[rules]]
id = 'email_ascii_v1'
type = 'EMAIL'
pattern = '[A-Za-z0-9_%+-]+(?:\.[A-Za-z0-9_%+-]+)*@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'
validator = 'email_ascii'

[[rules]]
id = 'phone_plus_v1'
type = 'PHONE'
pattern = '\+[1-9][0-9]{7,14}'
validator = 'phone_plus'

[[rules]]
id = 'phone_ru_v1'
type = 'PHONE'
pattern = '(?:\+7|8)[ -]?\([0-9]{3}\)[ -]?[0-9]{3}[ -]?[0-9]{2}[ -]?[0-9]{2}'
validator = 'phone_ru'

[[rules]]
id = 'card_pan_v1'
type = 'PAYMENT_CARD'
pattern = '[0-9](?:[ -]?[0-9]){12,18}'
validator = 'card_pan'
