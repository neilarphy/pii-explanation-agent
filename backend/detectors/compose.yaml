services:
  pii:
    image: pii-detectors:v1
    platform: linux/amd64
    runtime: nvidia
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NER_LABELS
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - MODEL_PATH=/models
    volumes:
      - ./models:/models:ro
    ports:
      - '127.0.0.1:${PII_PORT:-8000}:8000'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=2)']
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 30
    restart: on-failure
